<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIDE Post</title>
<style>
:root{--bg:#0f0f17;--sf:#181826;--sf2:#252540;--tx:#f2f2fa;--mu:#9a9ab8;--c1:#00e5ff;--c2:#ff2bd6;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;color:transparent;cursor:pointer;white-space:nowrap}
.top{position:sticky;top:0;z-index:9;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px)}
.search{flex:1;max-width:520px;margin:0 auto}
.search input{width:100%;margin:0;border-radius:22px;background:var(--sf);border:1px solid var(--sf2);padding:9px 16px}
.btn{background:var(--sf2);border:0;border-radius:20px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.25)}
button:disabled{opacity:.5;cursor:default}
.pri{background:linear-gradient(90deg,var(--c1),var(--c2));color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer}
.fol{background:linear-gradient(90deg,var(--c2),#ff7a3d);color:#fff;font-weight:700;padding:10px 22px;border-radius:22px;border:0;cursor:pointer;font-size:15px;box-shadow:0 0 14px #ff2bd655}
.fol.on{background:var(--sf2);box-shadow:none;color:var(--tx)}
.lay{display:flex}
.side{width:210px;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding:8px}
.ni{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer}
.ni:hover,.ni.on{background:var(--sf2)}
.side h4{margin:14px 12px 4px;color:var(--mu);font-size:12px;text-transform:uppercase}
.ct{flex:1;min-width:0;padding:12px 22px 40px}
@media(max-width:860px){.lay{display:block}.side{position:static;width:auto;height:auto;display:flex;overflow-x:auto;padding:4px 10px}.side h4,.side .fl{display:none}.ni{white-space:nowrap}.ct{padding:10px 12px}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px}
.chip{background:var(--sf2);border:0;border-radius:9px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);font-weight:700}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px 16px}
.vc{cursor:pointer}
.th{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--sf)}
.th img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.vc:hover .th img{transform:scale(1.05)}
.tc{display:flex;align-items:center;justify-content:center;height:100%;padding:16px;text-align:center;font-weight:800;font-size:18px;overflow:hidden}
.bd{position:absolute;right:8px;bottom:8px;background:#000b;border-radius:6px;padding:2px 8px;font-size:12px}
.bd.l{right:auto;left:8px}
.spb{position:absolute;left:8px;top:8px;background:#ffcc00;color:#000;font-weight:700;font-size:11px;padding:2px 8px;border-radius:6px;z-index:2}
.row{display:flex;gap:12px;margin-top:10px}
.ti{font-weight:700;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--mu);font-size:13px}
.av{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;color:#fff}
.empty{text-align:center;color:var(--mu);padding:60px 0;line-height:2.4}
.wt{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px}
@media(max-width:1050px){.wt{grid-template-columns:1fr}}
.gal{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9}
.gal img{width:100%;height:100%;object-fit:contain}
.ar{position:absolute;top:50%;transform:translateY(-50%);background:#000a;border:0;color:#fff;font-size:26px;width:42px;height:42px;border-radius:50%;cursor:pointer}
.ar.l{left:10px}.ar.r{right:10px}
.h1{font-size:22px;margin:14px 0 6px}
.ab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.ab .sp{flex:1}
.pill{display:flex;background:var(--sf2);border-radius:22px;overflow:hidden}
.pill button{background:none;border:0;padding:9px 16px;cursor:pointer;font-size:15px}
.pill button.on{color:var(--c2)}
.desc{background:var(--sf);border-radius:var(--r);padding:14px;white-space:pre-wrap;word-break:break-word}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.mc{background:var(--sf2);border-radius:14px;padding:3px 12px;font-size:13px}
.tag{color:var(--c1);cursor:pointer}
.lc{display:flex;flex-direction:column;gap:2px;background:var(--sf);border:1px solid var(--sf2);border-radius:12px;padding:12px;margin-top:12px}
.lc span{color:var(--mu);font-size:12px}
.poll{background:var(--sf);border-radius:var(--r);padding:14px;margin-top:12px}
.po{position:relative;display:flex;justify-content:space-between;width:100%;margin-top:8px;padding:10px 14px;border:1px solid var(--sf2);border-radius:10px;background:none;cursor:pointer;overflow:hidden;text-align:left}
.po i{position:absolute;left:0;top:0;bottom:0;background:#00e5ff33}
.po span,.po em{position:relative;font-style:normal}
button.po:hover{border-color:var(--c1)}
.cm{display:flex;gap:12px;margin:16px 0}
.mr{display:flex;gap:10px;margin-bottom:12px;cursor:pointer}
.mr .th{width:168px;flex-shrink:0;border-radius:10px}
.mr .tc{font-size:12px;padding:8px}
.banner{height:150px;border-radius:var(--r)}
.ph{display:flex;align-items:flex-end;gap:18px;margin:-40px 20px 20px;flex-wrap:wrap}
.ph .av{border:4px solid var(--bg)}
.cam{position:absolute;right:0;bottom:0;background:var(--c1);color:#000;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.box{background:var(--sf);border-radius:18px;max-width:600px;width:100%;max-height:94vh;overflow:auto;padding:20px}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--sf2);border-radius:10px;padding:10px;margin:5px 0}
.mood button{background:var(--sf2);border:2px solid transparent;border-radius:10px;font-size:20px;padding:3px 8px;cursor:pointer}
.mood button.on{border-color:var(--c1)}
.err{color:#ff5470;font-size:13px;min-height:18px}
.auth{max-width:380px;margin:8vh auto;padding:20px;text-align:center}
.prev img{height:56px;border-radius:8px;margin:4px 4px 0 0}
body.light{--bg:#f3f3fa;--sf:#fff;--sf2:#e4e4f0;--tx:#15151f;--mu:#62627a}
.sc{background:var(--sf);border-radius:var(--r);padding:18px;margin-bottom:16px}.sc h3{margin:0 0 10px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--sf2)}
.dg{background:#ff3b5c;color:#fff;border:0;border-radius:20px;padding:8px 16px;cursor:pointer;font-weight:600}
.dot{display:inline-flex;width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;vertical-align:middle}.dot.on{border-color:var(--tx)}
.bell{position:relative;cursor:pointer;font-size:20px}.bell b{position:absolute;top:-6px;right:-9px;background:var(--c2);color:#fff;border-radius:9px;font-size:11px;padding:0 5px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:22px;z-index:50;font-weight:600}
.nt{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;cursor:pointer}.nt:hover{background:var(--sf2)}.nt.un{background:var(--sf)}
.lv{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px}@media(max-width:1000px){.lv{grid-template-columns:1fr}}
.stage{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#000;color:#fff}
.stage img.si{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000e}
.onair{position:absolute;top:10px;left:10px;font-size:12px;background:#ff2b5c;color:#fff;font-weight:800;padding:2px 10px;border-radius:6px;animation:pl 1.4s infinite;z-index:3}
.mst{position:absolute;left:10px;bottom:10px;z-index:3;background:#000a;color:#fff;border-radius:6px;padding:2px 8px;font-size:12px}
.btn.on{background:var(--c1);color:#000}
@keyframes pl{50%{opacity:.5}}
.rx{position:absolute;bottom:10px;font-size:28px;animation:up 2.6s ease-out forwards;pointer-events:none;z-index:3}
@keyframes up{to{transform:translateY(-220px);opacity:0}}
.chat{display:flex;flex-direction:column;height:580px;background:var(--sf);border-radius:var(--r);padding:12px}
.msgs{flex:1;overflow:auto}.msg{display:flex;gap:8px;margin:8px 0;font-size:14px;align-items:flex-start;word-break:break-word}
#simg{z-index:1}
.ct.np{padding:0}
.sw{overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;background:#000}
.sw::-webkit-scrollbar{display:none}
.sl{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:#fff}
.sbgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(30px) brightness(.45);transform:scale(1.2)}
.sbgc{position:absolute;inset:0}
.sin{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:12px 66px 14px 12px}
.smd{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.sim{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.sim::-webkit-scrollbar{display:none}
.sim img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
.smd .tc{width:100%;height:100%;max-height:75%;border-radius:var(--r);font-size:24px;color:#fff}
.smd .bd{z-index:2}
.smd .spb{top:6px;left:6px}
.sif{padding-top:10px;text-shadow:0 1px 6px #000}
.sif .ti{-webkit-line-clamp:3;font-size:17px;margin-top:8px;color:#fff}
.sif .sx{color:#e6e6f0;font-size:14px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sact{position:absolute;right:8px;bottom:24px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:3}
.sb{background:#0008;border:0;color:#fff;border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sb small{font-size:10px;margin-top:2px}
.sb.on{color:var(--c2);box-shadow:0 0 0 2px var(--c2)}
.snav{position:fixed;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:8}
.snav button{width:44px;height:44px;border-radius:50%;border:0;background:var(--sf2);cursor:pointer;font-size:18px}
@media(max-width:860px){.snav{display:none}}
.adbtn{color:var(--c2);font-weight:700}
.ni .ico{width:22px;height:22px;flex:none;display:inline-block;background:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}

<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,signOut,sendPasswordResetEmail,deleteUser,reauthenticateWithPopup,reauthenticateWithCredential,EmailAuthProvider} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,query,orderBy,limit,getDocs,increment,serverTimestamp,where,arrayUnion,arrayRemove,onSnapshot,deleteField} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDtCmvlrwEblK8a5e0L9vwuLZ2XCIstiDo",authDomain:"pide-post.firebaseapp.com",projectId:"pide-post",storageBucket:"pide-post.firebasestorage.app",messagingSenderId:"664464722132",appId:"1:664464722132:web:6a1479bf8d1aea7e8b9341"});
const auth=getAuth(app),db=getFirestore(app);
const MAX_VIEWERS=10; // comme dans Nexus, la voix/vidéo part directement du créateur vers chaque spectateur (WebRTC) : au-delà de ~10, sa connexion sature
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TAG=/#([\p{L}\p{N}_]{2,30})/gu;
const CATS=["Tout","Photo","Humour","Musique","Gaming","Voyage","Food","Actu","Autre"];
const S={user:null,me:null,posts:[],users:{},likes:new Set(),votes:{},follows:new Set(),tab:"foryou",cat:"Tout",tag:null,q:"",view:{t:"feed"},gi:0,cm:{},ads:[],mood:"",notifs:[],lives:{}};
let L=null;
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+" M":n>=1e3?(n/1e3).toFixed(1)+" k":(n||0);
const ms=p=>p.createdAt?.toMillis?.()||Date.now();
const ago=t=>{const m=(Date.now()-(t?.toMillis?.()||Date.now()))/6e4;return m<1?"à l'instant":m<60?"il y a "+Math.floor(m)+" min":m<1440?"il y a "+Math.floor(m/60)+" h":"il y a "+Math.floor(m/1440)+" j"};
const once=k=>{k="pp_"+k;if(sessionStorage[k])return false;sessionStorage[k]=1;return true};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const nm=(uid,f)=>S.users[uid]?.name||f||"Anonyme";
const av=(uid,sz=36)=>{const u=S.users[uid]||{},n=u.name||"?";return u.photo?`<img class="av" style="width:${sz}px;height:${sz}px" src="${esc(u.photo)}">`:`<span class="av" style="width:${sz}px;height:${sz}px;font-size:${sz*.45}px;background:hsl(${hue(uid)} 55% 38%)">${esc(n[0]).toUpperCase()}</span>`};

function shrink(file,max,q){return new Promise((ok,ko)=>{
  if(!file.type.startsWith("image/"))return ko(new Error("Seules les photos sont autorisées (pas de vidéo ni de son)."));
  const im=new Image,u=URL.createObjectURL(file);
  im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",q))};
  im.onerror=()=>ko(new Error("Image illisible."));im.src=u})}

/* ---------- Erreurs & démarrage ---------- */
const MSG={"auth/operation-not-allowed":"Cette méthode de connexion n'est pas activée : Firebase → Authentication → Sign-in method.","auth/unauthorized-domain":"Domaine non autorisé : ajoute-le dans Firebase → Authentication → Settings → Domaines autorisés.","auth/invalid-credential":"Email ou mot de passe incorrect.","auth/wrong-password":"Mot de passe incorrect.","auth/user-not-found":"Aucun compte avec cet email.","auth/email-already-in-use":"Cet email est déjà utilisé : clique sur Connexion.","auth/weak-password":"Mot de passe trop court (6 caractères min.).","auth/invalid-email":"Adresse email invalide.","auth/missing-password":"Entre un mot de passe.","auth/popup-closed-by-user":"Fenêtre Google fermée avant la fin.","auth/cancelled-popup-request":"","auth/popup-blocked":"Popup bloquée : autorise-la puis réessaie.","auth/network-request-failed":"Problème de réseau, réessaie.","auth/too-many-requests":"Trop de tentatives, réessaie plus tard.","auth/operation-not-supported-in-this-environment":"Ouvre le site en http(s), pas en file://.","permission-denied":"Firestore refuse l'accès : mets à jour les règles Firestore.","failed-precondition":"Firestore demande un index : clique sur le lien dans la console (F12)."};
const errMsg=e=>{const c=e?.code||"";return c in MSG?MSG[c]:(e?.message||"Erreur inconnue")+(c?" ["+c+"]":"")};
const showErr=m=>{S.err=m;const el=$("err");if(el)el.textContent=m};
async function boot(u){
  S.user=u;S.me=null;S.boot=null;S.err="";
  if(u){try{const d=await getDoc(doc(db,"users",u.uid));
      if(d.exists()){S.me=d.data();await loadSocial();await loadFeed();await loadNotifs();watchLives()}}
    catch(e){console.error(e);S.boot=errMsg(e)}}
  render();const h=location.hash.slice(1);if(S.me&&h&&!S.hash&&S.posts.find(x=>x.id===h)){S.hash=1;A.open(h)}}
onAuthStateChanged(auth,u=>{if(!S.busy)boot(u)});
async function loadNotifs(){try{const q=await getDocs(query(collection(db,"notifs"),where("to","==",S.user.uid),limit(60)));S.notifs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ms(b)-ms(a))}catch(e){S.notifs=[]}}
const notify=(to,type,pid)=>{if(!to||to===S.user.uid)return;addDoc(collection(db,"notifs"),{to,from:S.user.uid,type,pid:pid||"",read:false,createdAt:serverTimestamp()}).catch(()=>{})};
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const applyTheme=()=>{const s=S.me?.settings||{};document.body.classList.toggle("light",s.theme==="light");document.documentElement.style.setProperty("--c1",s.accent||"#00e5ff")};
const folTxt=uid=>{const u=S.users[uid]||{};return uid!==S.user.uid&&u.settings?.showFollowers===false?"":fmt(u.followers)+" abonnés"};
const tagRow=()=>{const c={};S.posts.forEach(p=>(p.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));const t=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8);

/* ---------- Algorithme ---------- */
function score(p){
  const tw=S.me?.tagWeights||{};
  const aff=(p.tags||[]).reduce((a,t)=>a+Math.log1p(tw[t]||0),0);
  const eng=(p.likes||0)+2*(p.comments||0);
  const rate=(eng+1)/((p.views||0)+10),ctr=((p.clicks||0)+1)/((p.impressions||0)+10);
  const fresh=Math.exp(-((Date.now()-ms(p))/36e5)/48);
  return aff*1.2+rate*8+ctr*5+fresh*2+((p.views||0)<20?1.5:0)+(S.follows.has(p.authorId)?2:0)+Math.log1p(eng)*.5}
const trend=p=>((p.likes||0)*3+(p.comments||0)*5+(p.views||0)*.2)/Math.pow((Date.now()-ms(p))/36e5+2,1.3);
function visible(){
  let a=S.posts.filter(p=>!p.liveOn);
  if(S.cat!=="Tout")a=a.filter(p=>p.cat===S.cat);
  if(S.tag)a=a.filter(p=>(p.tags||[]).includes(S.tag));
  if(S.q){const q=S.q.toLowerCase();a=a.filter(p=>((p.title||"")+" "+p.text+" "+nm(p.authorId,p.authorName)+" "+(p.tags||[]).join(" ")).toLowerCase().includes(q))}
  if(S.tab==="saved")return a.filter(p=>(S.me.saved||[]).includes(p.id));
  if(S.tab==="recent")return a;
  if(S.tab==="follow")return a.filter(p=>S.follows.has(p.authorId));
  return a.sort((x,y)=>S.tab==="trend"?trend(y)-trend(x):score(y)-score(x))}
const boost=(tags,n)=>{if(!tags?.length||!S.me)return;const u={};S.me.tagWeights=S.me.tagWeights||{};
  tags.forEach(t=>{u["tagWeights."+t]=increment(n);S.me.tagWeights[t]=(S.me.tagWeights[t]||0)+n});
  updateDoc(doc(db,"users",S.user.uid),u).catch(()=>{})};

const AD_UNIT=100,AD_RATE=2,AD_MIN=100,AD_MAX=100000,AD_DAYS=7; // 2 € / 100 affichages ; diffusion étalée sur 7 jours minimum
const PROMO_H="0ba83311151315448242301c307b5a76ec21ae3cac53a28c2b74ecd08d4a2144"; // SHA-256 du code (le code n'apparaît pas en clair)
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const codeOK=async()=>{const v=($("ac")?.value||"").trim();if(!v||!crypto.subtle)return false;return (await sha(v))===PROMO_H};
const adPrice=n=>Math.round(n/AD_UNIT*AD_RATE*100)/100;
const eur=n=>n.toFixed(2).replace(".",",")+" €";
const today=()=>new Date().toISOString().slice(0,10);
const safeLink=l=>{try{const u=new URL(l);return /^https?:$/.test(u.protocol)?u.href:""}catch{return""}};
const safeImg=s=>typeof s==="string"&&/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(s);
const adHost=a=>{try{return new URL(a.link).hostname}catch{return""}};

const markSeen=id=>{try{const m=seenMap();m[id]=Date.now();localStorage.pp_adseen=JSON.stringify(m)}catch{}};
const adCap=a=>Math.max(10,Math.ceil(a.impTotal/AD_DAYS)); // plafond quotidien : pas tout d'un coup
const adOk=a=>a.active!==false&&(a.impDone||0)<a.impTotal&&!!safeLink(a.link)&&(a.dayKey!==today()||(a.dayDone||0)<adCap(a));
function adPicker(){const used=new Set();return()=>{const e=S.ads.filter(a=>!used.has(a.id)&&adOk(a));if(!e.length)return null;const a=e[Math.floor(Math.random()*e.length)];used.add(a.id);return a}}

  a.impDone=(a.impDone||0)+1;if(a.impDone>=a.impTotal){u.active=false;a.active=false}

const loadPP=()=>new Promise((ok,ko)=>{if(window.paypal)return ok();const sc=document.createElement("script");sc.src="https://www.paypal.com/sdk/js?client-id="+PP_ID+"&currency=EUR&locale=fr_FR";sc.onload=ok;sc.onerror=()=>ko(new Error("PayPal indisponible : vérifie le Client ID."));document.head.appendChild(sc)});

  S.swStart=null;S.swUid=null;

  sw.querySelectorAll(".sl").forEach(c=>io.observe(c))}

  return l.length||lc?`<div class="gr">${lc}${l.map((p,i)=>cardHTML(p)+((i===Math.min(3,l.length-1)||(i>3&&(i-3)%10===0))?adCard(pk()):"")).join("")}</div>`:`<div class="empty">Rien à voir ici pour l'instant.<br><button class="pri" onclick="A.compose()">Publier un post</button></div>`};
function afterGrid(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);
    const id=e.target.dataset.id;if(id&&once("i_"+id)){const p=S.posts.find(x=>x.id===id);
      if(p&&p.authorId!==S.user.uid)updateDoc(doc(db,"posts",id),{impressions:increment(1)}).catch(()=>{})}}),{threshold:.6});
  document.querySelectorAll(".vc[data-id]").forEach(c=>io.observe(c));observeAds(document.querySelectorAll(".vc[data-ad]"))}

/* ---------- LIVE : WebRTC + signalisation Firestore, comme dans Nexus (aucun service en plus) ---------- */
const lref=id=>doc(db,"posts",id);
const bm=x=>x.beat?.toMillis?.()||Date.now();
function applyLives(){
  const raw=S.liveRaw||{},now=Date.now(),v={};
  Object.entries(raw).forEach(([id,x])=>{
    if(S.user&&x.authorId===S.user.uid&&(!L||L.id!==id)&&now-bm(x)>3e5)deleteDoc(lref(id)).catch(()=>{});
    if(now-bm(x)<9e4)v[id]={...x,hostId:x.authorId,hostName:x.authorName}});
  const sig=JSON.stringify(Object.entries(v).map(([k,x])=>[k,x.n||0,x.title]));S.lives=v;
  if(sig!==S.lsig){S.lsig=sig;if(S.me&&S.view.t==="feed")renderFeed()}}
function watchLives(){if(S.lw)return;S.lw=1;
  onSnapshot(query(collection(db,"posts"),where("liveOn","==",true)),sn=>{S.liveRaw={};sn.docs.forEach(d=>S.liveRaw[d.id]=d.data());applyLives()},e=>console.warn("lives",e));
  setInterval(applyLives,15000)}
const waitIce=(pc,t=4000)=>new Promise(res=>{if(pc.iceGatheringState==="complete")return res();
  const h=()=>{if(pc.iceGatheringState==="complete"){clearTimeout(tm);pc.removeEventListener("icegatheringstatechange",h);res()}},tm=setTimeout(()=>{pc.removeEventListener("icegatheringstatechange",h);res()},t);
  pc.addEventListener("icegatheringstatechange",h)});
function leaveLive(){if(!L)return;clearInterval(L.hb);clearTimeout(L.ct);L.un.forEach(f=>{try{f()}catch(e){}});
  Object.values(L.pcs||{}).forEach(p=>p.close());L.pc?.close();
  if(L.host)[L.stream,L.camStream,L.scrStream].forEach(st=>st&&st.getTracks().forEach(t=>t.stop()));
  if(L.audio)L.audio.srcObject=null;
  if(!L.host)updateDoc(lref(L.id),{["rtc."+S.user.uid]:deleteField()}).catch(()=>{});
  L=null}
/* --- côté créateur --- */
function addTracks(pc){
  if(!L||pc.connectionState==="closed")return;
  L.stream.getTracks().forEach(t=>{if(!pc._snd[t.id])pc._snd[t.id]=pc.addTrack(t,L.stream)});
  [["camTrack","camStream"],["scrTrack","scrStream"]].forEach(([a,b])=>{const t=L[a];if(t&&!pc._snd[t.id])pc._snd[t.id]=pc.addTrack(t,L[b])})}
async function offer(vid,pc){if(!L||pc.signalingState!=="stable")return;
  try{const o=await pc.createOffer();if(pc.signalingState!=="stable")return;await pc.setLocalDescription(o);await waitIce(pc);
    pc._rev=Date.now();await updateDoc(lref(L.id),{["rtc."+vid+".o"]:{type:pc.localDescription.type,sdp:pc.localDescription.sdp,rev:pc._rev}})}catch(e){console.warn("offer",e)}}
function countViewers(){if(!L?.host)return;clearTimeout(L.ct);
  L.ct=setTimeout(()=>{if(!L)return;const n=Object.values(L.pcs).filter(p=>p.connectionState==="connected").length;if(n!==L.n){L.n=n;updateDoc(lref(L.id),{n}).catch(()=>{})}},800)}
function peer(vid,j){
  const pc=new RTCPeerConnection(ICE);L.pcs[vid]?.close();L.pcs[vid]=pc;pc._j=j;pc._snd={};
  pc.onconnectionstatechange=()=>{countViewers();if(pc.connectionState==="failed")pc.close()};
  pc.onnegotiationneeded=()=>offer(vid,pc);
  addTracks(pc)}
function hostSync(d){
  const r=d.rtc||{};
  Object.entries(r).forEach(([vid,x])=>{const pc=L.pcs[vid];
    if(x.j&&(!pc||pc._j!==x.j)){if(Object.keys(L.pcs).length<MAX_VIEWERS)peer(vid,x.j)}
    else if(pc&&x.a&&x.a.rev===pc._rev&&pc.signalingState==="have-local-offer")pc.setRemoteDescription(x.a).catch(()=>{})});
  Object.keys(L.pcs).forEach(vid=>{if(!r[vid]){L.pcs[vid].close();delete L.pcs[vid];countViewers()}})}
/* --- chat, réactions, images du créateur : sous-collection du post --- */
function listenLive(id){
  L.un.push(onSnapshot(query(collection(db,"posts",id,"comments"),orderBy("createdAt","desc"),limit(100)),sn=>{
    if(!L||L.id!==id)return;
    sn.docChanges().filter(c=>c.type==="added").map(c=>c.doc.data()).sort((x,y)=>ms(x)-ms(y)).forEach(m=>{
      if(m.kind==="react"){if(m.c>=L.t0)floatRx(m.e)}
      else if(m.kind==="img"){if(m.uid===L.info?.hostId){L.img=m.src||"";drawImg()}}
      else if(m.kind==="chat"){L.msgs.push(m);addMsg(m)}})}))}
/* --- côté spectateur --- */
async function joinLive(id){
  const l=S.lives[id];if(!l)return;
  if(L&&L.id===id){S.view={t:"live",id};return render()}
  if(l.hostId===S.user.uid)return;
  if((l.n||0)>=MAX_VIEWERS)return alert("Ce live est complet ("+MAX_VIEWERS+" spectateurs max).");
  if(L?.host)return alert("Termine d'abord ton propre live.");
  if(L)leaveLive();S.liveSeen=true;if(once("v_"+id))updateDoc(lref(id),{views:increment(1)}).catch(()=>{});
  const uid=S.user.uid,pc=new RTCPeerConnection(ICE),au=new Audio();au.autoplay=true;
  L={id,host:false,un:[],msgs:[],t0:Date.now(),info:l,pc,audio:au};
  S.view={t:"live",id};render();listenLive(id);
  pc.ontrack=e=>{if(!L)return;if(e.track.kind==="audio"){au.srcObject=e.streams[0];au.play().catch(()=>{})}else{(L.rs=L.rs||{})[e.streams[0].id]=e.streams[0];drawVideo()}};
  try{await updateDoc(lref(id),{["rtc."+uid]:{j:Date.now()}})}catch(e){toast("Connexion au live impossible");leaveLive();S.view={t:"feed"};return render()}
  if(!L||L.id!==id)return;
  L.un.push(onSnapshot(lref(id),async sn=>{
    if(!L||L.id!==id)return;
    if(!sn.exists()||!sn.data().liveOn){toast("Le live est terminé");leaveLive();S.view={t:"feed"};return render()}
    const d=sn.data();L.info={...d,hostId:d.authorId,hostName:d.authorName};L.poll=d.lpoll||null;L.votes=d.lvotes||{};drawMic();drawVideo();drawPoll();
    const o=d.rtc?.[uid]?.o;
    if(o&&o.rev!==pc._rev){pc._rev=o.rev;
      try{await pc.setRemoteDescription({type:o.type,sdp:o.sdp});const an=await pc.createAnswer();await pc.setLocalDescription(an);await waitIce(pc);
        await updateDoc(lref(id),{["rtc."+uid+".a"]:{type:pc.localDescription.type,sdp:pc.localDescription.sdp,rev:o.rev}})}catch(e){console.warn("answer",e)}}}))}
function addMsg(m){const b=$("lchat");if(!b)return;const d=document.createElement("div");d.className="msg";d.innerHTML=av(m.uid,28)+`<div><b>${esc(m.name)}</b> ${esc(m.text)}</div>`;b.appendChild(d);b.scrollTop=b.scrollHeight}
function floatRx(e){const st=$("stage");if(!st)return;const x=document.createElement("span");x.className="rx";x.textContent=e;x.style.left=(8+Math.random()*80)+"%";st.appendChild(x);setTimeout(()=>x.remove(),2700)}

function drawImg(){const st=$("stage");if(!st)return;let im=$("simg");if(!L.img){im?.remove();return}

function pipDrag(pw){
  pw.onpointerdown=e=>{const st=$("agv").getBoundingClientRect(),r=pw.getBoundingClientRect(),h=e.target.id==="vph",sx=e.clientX,sy=e.clientY,ox=r.left-st.left,oy=r.top-st.top,ow=r.width;
    L.dragging=1;pw.setPointerCapture(e.pointerId);e.preventDefault();
    pw.onpointermove=m=>{
      if(h)pw.style.width=Math.min(60,Math.max(12,(ow+m.clientX-sx)/st.width*100))+"%";
      else{pw.style.left=Math.min(100-parseFloat(pw.style.width),Math.max(0,(ox+m.clientX-sx)/st.width*100))+"%";pw.style.top=Math.min(100-pw.offsetHeight/st.height*100,Math.max(0,(oy+m.clientY-sy)/st.height*100))+"%"}};
    pw.onpointerup=()=>{pw.onpointermove=pw.onpointerup=null;if(L)L.dragging=0;
      const f=k=>+parseFloat(pw.style[k]).toFixed(1);if(L)updateDoc(lref(L.id),{pip:{x:f("left"),y:f("top"),w:f("width")}}).catch(()=>{})}}}

    if(vm.srcObject!==main)vm.srcObject=main;vm.play().catch(()=>{})}

  $("bcam")?.classList.toggle("on",!!L.camTrack);$("bscr")?.classList.toggle("on",!!L.scrTrack)}

async function creditLive(a,hostId){
  if(!a||!hostId||hostId===S.user.uid||a.authorId===S.user.uid)return;
  if(a.promo===true||!((+a.paid)>0))return; // pub gratuite (code de réduction) : aucun gain
  const b=Math.floor(Date.now()/6e5),k="pp_cr_"+hostId+"_"+b;if(sessionStorage[k])return;
  let u=S.users[hostId];if(!u){try{u=(await getDoc(doc(db,"users",hostId))).data()||{};S.users[hostId]=u}catch(e){return}}
  if(!u.monet)return; // le streamer n'a pas renseigné son email PayPal
  sessionStorage[k]=1;
  setDoc(doc(db,"earnings",S.user.uid+"_"+hostId+"_"+b),{to:hostId,from:S.user.uid,adId:a.id,cents:1,createdAt:serverTimestamp()}).catch(()=>{})}

    S.busy=false;if(auth.currentUser)await boot(auth.currentUser)},
  async login(){const em=$("em").value.trim();if(!em)return showErr("Entre ton email.");
    showErr("");try{await signInWithEmailAndPassword(auth,em,$("pw").value)}catch(e){showErr(errMsg(e))}},
  async accept(){
    if(!$("ok").checked)return showErr("Tu dois accepter les conditions.");
    try{const u=auth.currentUser,me={name:u.displayName||(u.email||"membre").split("@")[0],photo:u.photoURL||"",bio:"",followers:0,tagWeights:{},terms:true,termsAt:serverTimestamp()};
      await setDoc(doc(db,"users",u.uid),me);S.me=me;await loadSocial();await loadFeed();render()}
    catch(e){console.error(e);showErr(errMsg(e))}},
  profile(uid){S.view={t:"profile",uid};render();scrollTo(0,0)},
  async avatar(inp){const f=inp.files[0];if(!f)return;
    try{const d=await shrink(f,256,.8);await updateDoc(doc(db,"users",S.user.uid),{photo:d});S.me.photo=d;S.users[S.user.uid]=S.me;render()}catch(e){alert(errMsg(e))}},
  async editProfile(){
    const n=prompt("Pseudo :",S.me.name);if(n===null)return;const b=prompt("Bio (à propos de toi) :",S.me.bio||"");
    const u={name:n.trim()||S.me.name};if(b!==null)u.bio=b.trim().slice(0,200);
    try{await updateDoc(doc(db,"users",S.user.uid),u);Object.assign(S.me,u);render()}catch(e){alert(errMsg(e))}},
  compose(){S.mood="";$("modal").innerHTML=`<div class="modal"><div class="box"><h3 style="margin-top:0">Créer un post</h3>
    <input id="ti" maxlength="100" placeholder="Titre (optionnel)">
    <textarea id="pt" rows="4" maxlength="2000" placeholder="Écris quelque chose… ajoute des #hashtags"></textarea>
    <input id="pf" type="file" accept="image/*" multiple onchange="A.prev(this)"><div class="prev" id="pv"></div>
    <select id="cat">${CATS.slice(1).map(c=>`<option>${c}</option>`).join("")}</select>
    <div class="mood" style="margin:6px 0">${["😀","😍","😎","🔥","😂","🤔","😢","🎉"].map(e=>`<button type="button" onclick="A.mood(this,'${e}')">${e}</button>`).join(" ")}</div>
    <input id="lo" maxlength="60" placeholder="📍 Lieu (optionnel)"><input id="lk" placeholder="🔗 Lien (optionnel)">
    <label><input type="checkbox" id="pollon" style="width:auto" onchange="$('pollbox').style.display=this.checked?'block':'none'"> Ajouter un sondage</label>
    <div id="pollbox" style="display:none"><input id="pq" placeholder="Question du sondage">${[1,2,3,4].map(i=>`<input class="pop" placeholder="Choix ${i}">`).join("")}</div>
    <div class="err" id="err">Photos (jusqu'à 4) et texte uniquement.</div>
    <button class="pri" id="pb" onclick="A.publish()">Publier</button> <button class="btn" onclick="A.close()">Annuler</button></div></div>`},
  mood(b,e){S.mood=S.mood===e?"":e;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.textContent===S.mood))},
  prev(i){$("pv").innerHTML=[...i.files].slice(0,4).map(f=>`<img src="${URL.createObjectURL(f)}">`).join("")},
  close(){$("modal").innerHTML=""},
  async publish(){
    const title=$("ti").value.trim(),text=$("pt").value.trim(),fs=[...$("pf").files].slice(0,4);let link=$("lk").value.trim();
    const opts=$("pollon").checked?[...document.querySelectorAll(".pop")].map(i=>i.value.trim()).filter(Boolean):[];
    if(!title&&!text&&!fs.length)return showErr("Ajoute un titre, du texte ou une photo.");
    if($("pollon").checked&&opts.length<2)return showErr("Un sondage a besoin d'au moins 2 choix.");
    if(link){if(!/^https?:\/\//i.test(link))link="https://"+link;try{new URL(link)}catch{return showErr("Lien invalide.")}}
    $("pb").disabled=true;showErr("Publication…");
    try{const imgs=[];for(const f of fs)imgs.push(await shrink(f,900,.6));
      const thumb=fs[0]?await shrink(fs[0],480,.65):"";
      if(imgs.join("").length+thumb.length>900000)throw new Error("Photos trop lourdes : choisis-en moins.");
      const tags=[...new Set([...(title+" "+text).matchAll(TAG)].map(m=>m[1].toLowerCase()))].slice(0,10);
      const d={title,text,tags,imgs,thumb,cat:$("cat").value,mood:S.mood,place:$("lo").value.trim(),link,authorId:S.user.uid,authorName:S.me.name,likes:0,comments:0,views:0,clicks:0,impressions:0,createdAt:serverTimestamp()};
      if(opts.length){d.poll={q:$("pq").value.trim(),opts};d.pv={}}
      const rf=await addDoc(collection(db,"posts"),d);boost(tags,2);await loadFeed();A.close();S.swStart=rf.id;S.swUid=S.user.uid;S.view={t:"swipe"};render()}
    catch(e){showErr(errMsg(e));$("pb").disabled=false}},
  open(id){const p=S.posts.find(x=>x.id===id);if(!p)return;if(p.liveOn)return A.joinLive(id);
    S.swStart=id;S.swUid=S.view.t==="profile"?S.view.uid:null;history.replaceState(null,"",location.pathname);S.view={t:"swipe"};render();scrollTo(0,0)},
  async openPost(id){
    const p=S.posts.find(x=>x.id===id);if(!p)return;if(p.liveOn)return A.joinLive(id);
    if(p.authorId!==S.user.uid){
      if(once("v_"+id)){p.views=(p.views||0)+1;updateDoc(doc(db,"posts",id),{views:increment(1)}).catch(()=>{});boost(p.tags,1)}
      if(once("c_"+id)){p.clicks=(p.clicks||0)+1;updateDoc(doc(db,"posts",id),{clicks:increment(1)}).catch(()=>{})}}
    S.view={t:"post",id};S.gi=0;history.replaceState(null,"","#"+id);render();scrollTo(0,0)},
  gal(d){const p=S.posts.find(x=>x.id===S.view.id),n=p.imgs.length;S.gi=(S.gi+d+n)%n;renderPost()},
  async loadCm(id){try{const cs=await getDocs(query(collection(db,"posts",id,"comments"),orderBy("createdAt","asc"),limit(100)));
    S.cm[id]=cs.docs.map(d=>d.data());if(S.view.id===id&&$("cms"))$("cms").innerHTML=cmHTML(S.cm[id])}catch(e){if($("cms"))$("cms").innerHTML=`<span class="err">${esc(errMsg(e))}</span>`}},
  async like(id){
    const p=S.posts.find(x=>x.id===id),ref=doc(db,"likes",id+"_"+S.user.uid);
    try{if(S.likes.has(id)){S.likes.delete(id);p.likes--;redraw();await deleteDoc(ref);updateDoc(doc(db,"posts",id),{likes:increment(-1)})}
    else{S.likes.add(id);p.likes=(p.likes||0)+1;redraw();await setDoc(ref,{pid:id,uid:S.user.uid});updateDoc(doc(db,"posts",id),{likes:increment(1)});boost(p.tags,3);notify(p.authorId,"like",id)}}catch(e){alert(errMsg(e))}},
  async vote(id,i){const p=S.posts.find(x=>x.id===id);if(S.votes[id]!==undefined)return;
    S.votes[id]=i;p.pv=p.pv||{};p.pv[i]=(p.pv[i]||0)+1;renderPost();
    try{await setDoc(doc(db,"likes","v_"+id+"_"+S.user.uid),{pid:id,uid:S.user.uid,vote:i});await updateDoc(doc(db,"posts",id),{["pv."+i]:increment(1)})}catch(e){alert(errMsg(e))}},
  async comment(id){
    const t=$("ct2").value.trim();if(!t)return;const p=S.posts.find(x=>x.id===id);
    try{const c={text:t,name:S.me.name,uid:S.user.uid,createdAt:serverTimestamp()};
      await addDoc(collection(db,"posts",id,"comments"),c);updateDoc(doc(db,"posts",id),{comments:increment(1)});
      p.comments=(p.comments||0)+1;(S.cm[id]=S.cm[id]||[]).push({...c,createdAt:{toMillis:()=>Date.now()}});boost(p.tags,4);notify(p.authorId,"comment",id);renderPost()}catch(e){alert(errMsg(e))}},
  async del(id){if(!confirm("Supprimer ce post ?"))return;
    try{await deleteDoc(doc(db,"posts",id));S.posts=S.posts.filter(x=>x.id!==id);S.view={t:"feed"};render()}catch(e){alert(errMsg(e))}},
  async follow(uid){
    const ref=doc(db,"follows",S.user.uid+"_"+uid),u=S.users[uid]||{};
    try{if(S.follows.has(uid)){S.follows.delete(uid);u.followers=Math.max(0,(u.followers||0)-1);render();await deleteDoc(ref);updateDoc(doc(db,"users",uid),{followers:increment(-1)})}
    else{S.follows.add(uid);u.followers=(u.followers||0)+1;render();await setDoc(ref,{from:S.user.uid,to:uid});updateDoc(doc(db,"users",uid),{followers:increment(1)});notify(uid,"follow")}}catch(e){alert(errMsg(e))}},
  setTab(t){S.setTab=t;renderSettings()},
  settings(){S.view={t:"settings"};render();scrollTo(0,0)},
  notifs(){S.view={t:"notifs"};render();S.notifs.filter(n=>!n.read).forEach(n=>{n.read=true;updateDoc(doc(db,"notifs",n.id),{read:true}).catch(()=>{})})},
  save(id){const a=S.me.saved||[],on=a.includes(id);S.me.saved=on?a.filter(x=>x!==id):[...a,id];
    updateDoc(doc(db,"users",S.user.uid),{saved:on?arrayRemove(id):arrayUnion(id)}).catch(e=>alert(errMsg(e)));toast(on?"Retiré des enregistrés":"Post enregistré");redraw()},
  share(id){const u=location.origin+location.pathname+"#"+id;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast("Lien copié"),()=>prompt("Copie le lien :",u))},
  async report(id){const r=prompt("Pourquoi signaler ce post ? (spam, haine, contenu illégal…)");if(!r)return;
    try{await addDoc(collection(db,"reports"),{pid:id,uid:S.user.uid,reason:r.slice(0,300),createdAt:serverTimestamp()});toast("Signalement envoyé, merci")}catch(e){alert(errMsg(e))}},
  async edit(id){const p=S.posts.find(x=>x.id===id),t=prompt("Titre :",p.title||"");if(t===null)return;const x=prompt("Texte :",p.text||"");if(x===null)return;
    const tags=[...new Set([...(t+" "+x).matchAll(TAG)].map(m=>m[1].toLowerCase()))].slice(0,10);
    try{await updateDoc(doc(db,"posts",id),{title:t.trim(),text:x.trim(),tags});Object.assign(p,{title:t.trim(),text:x.trim(),tags});renderPost()}catch(e){alert(errMsg(e))}},
  async saveProfile(){const u={name:$("sn").value.trim()||S.me.name,bio:$("sb").value.trim().slice(0,200),bannerHue:+$("bh").value};
    try{await updateDoc(doc(db,"users",S.user.uid),u);Object.assign(S.me,u);toast("Profil enregistré");render()}catch(e){alert(errMsg(e))}},
  async rmAvatar(){try{await updateDoc(doc(db,"users",S.user.uid),{photo:""});S.me.photo="";render()}catch(e){alert(errMsg(e))}},
  pref(k,v){S.me.settings={...(S.me.settings||{}),[k]:v};updateDoc(doc(db,"users",S.user.uid),{["settings."+k]:v}).catch(e=>alert(errMsg(e)));applyTheme();if(k==="theme"||k==="accent")render()},
  async resetReco(){if(!confirm("Réinitialiser tes recommandations ?"))return;
    try{await updateDoc(doc(db,"users",S.user.uid),{tagWeights:{}});S.me.tagWeights={};toast("Recommandations réinitialisées");render()}catch(e){alert(errMsg(e))}},
  async resetPw(){const e=auth.currentUser.email;if(!e)return alert("Ton compte utilise Google : change ton mot de passe depuis ton compte Google.");
    try{await sendPasswordResetEmail(auth,e);toast("Email de réinitialisation envoyé")}catch(x){alert(errMsg(x))}},
  exportData(){const mine=S.posts.filter(p=>p.authorId===S.user.uid).map(({thumb,imgs,...r})=>({...r,photos:(imgs||[]).length,createdAt:r.createdAt?.toDate?.().toISOString()}));
    const b=new Blob([JSON.stringify({profil:{...S.me,termsAt:undefined},posts:mine,enregistres:S.me.saved||[],abonnements:[...S.follows],likes:[...S.likes]},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="pide-post-mes-donnees.json";a.click()},
  async delAccount(){
    if(prompt("Suppression définitive de ton compte et de tes posts. Tape SUPPRIMER pour confirmer :")!=="SUPPRIMER")return;
    const u=auth.currentUser;
    try{if(u.providerData[0]?.providerId==="google.com")await reauthenticateWithPopup(u,new GoogleAuthProvider());
      else{const pw=prompt("Entre ton mot de passe pour confirmer :");if(!pw)return;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,pw))}
      const ps=await getDocs(query(collection(db,"posts"),where("authorId","==",u.uid)));
      await Promise.all(ps.docs.map(d=>deleteDoc(d.ref)));await deleteDoc(doc(db,"users",u.uid));await deleteUser(u)}
    catch(e){alert(errMsg(e))}},
  joinLive(id){const l=S.lives[id];if(!l)return toast("Ce live est terminé");
    if(L&&L.id===id)return joinLive(id);if(l.hostId===S.user.uid)return;if(L?.host)return alert("Termine d'abord ton propre live.");
    if(S.liveSeen)adInter(()=>{if(S.lives[id])joinLive(id);else toast("Ce live est terminé")},l.hostId);else joinLive(id)},
  liveModal(){if(L?.host){S.view={t:"live",id:L.id};return render()}
    $("modal").innerHTML=`<div class="modal"><div class="box"><h3 style="margin-top:0">🔴 Lancer un live</h3><input id="lt" maxlength="80" placeholder="Titre du live">
    <div class="sub">Ton micro sera partagé : tous les spectateurs t'entendent en direct. Tu peux lancer des sondages et afficher des images.</div>
    <div class="err" id="err"></div><button class="pri" onclick="A.startLive()">Démarrer le live</button> <button class="btn" onclick="A.close()">Annuler</button></div></div>`},
  async startLive(){
    const t=$("lt").value.trim();if(t.length<3)return showErr("Donne un titre au live (3 caractères min.).");
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){return showErr("Micro refusé ou introuvable : autorise-le dans le navigateur.")}
    const uid=S.user.uid;let id;
    try{id=(await addDoc(collection(db,"posts"),{title:t,text:"",tags:[],imgs:[],thumb:"",cat:"Live",mood:"",place:"",link:"",authorId:uid,authorName:S.me.name,likes:0,comments:0,views:0,clicks:0,impressions:0,createdAt:serverTimestamp(),live:true,liveOn:true,beat:serverTimestamp(),n:0,mic:true,camSid:null,scrSid:null,layout:"pip"})).id}
    catch(e){stream.getTracks().forEach(x=>x.stop());return showErr(errMsg(e))}
    L={id,host:true,un:[],msgs:[],t0:Date.now(),info:{hostId:uid,hostName:S.me.name,title:t,n:0,mic:true},pcs:{},stream,n:0};
    L.hb=setInterval(()=>updateDoc(lref(id),{beat:serverTimestamp()}).catch(()=>{}),20000);
    L.un.push(onSnapshot(lref(id),sn=>{if(!L||L.id!==id||!sn.exists())return;const d=sn.data();L.info={...d,hostId:d.authorId,hostName:d.authorName};L.poll=d.lpoll||null;L.votes=d.lvotes||{};drawMic();drawVideo();drawPoll();hostSync(d)}));
    listenLive(id);A.close();S.view={t:"live",id};render()},
  async endLive(silent){if(!L||!L.host)return;if(!silent&&!confirm("Terminer le live ?"))return;const id=L.id;leaveLive();
    try{const v=(await getDoc(lref(id))).data()?.views||0;if(v){await updateDoc(doc(db,"users",S.user.uid),{liveViews:increment(v)});S.me.liveViews=(S.me.liveViews||0)+v}}catch(e){}
    try{await deleteDoc(lref(id))}catch(e){await updateDoc(lref(id),{liveOn:false}).catch(()=>{})}
    if(!silent){S.view={t:"feed"};render()}},
  mic(){const t=L.stream.getAudioTracks()[0];t.enabled=!t.enabled;updateDoc(lref(L.id),{mic:t.enabled}).catch(()=>{});toast(t.enabled?"Micro activé":"Micro coupé")},
  livePoll(){if(L.poll&&!confirm("Remplacer le sondage actuel ?"))return;const q=prompt("Question du sondage :");if(!q)return;
    const o=(prompt("Choix séparés par des virgules (2 à 4) :")||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,4);
    if(o.length<2)return alert("Il faut au moins 2 choix.");updateDoc(lref(L.id),{lpoll:{q:q.slice(0,120),opts:o},lvotes:{}}).catch(e=>alert(errMsg(e)))},
  closePoll(){updateDoc(lref(L.id),{lpoll:deleteField(),lvotes:deleteField()}).catch(()=>{})},
  lvote(i){updateDoc(lref(L.id),{["lvotes."+S.user.uid]:i}).catch(e=>alert(errMsg(e)))},
  async liveImg(inp){const f=inp.files[0];if(!f)return;
    try{const d=await shrink(f,720,.5);await addDoc(collection(db,"posts",L.id,"comments"),{kind:"img",src:d,uid:S.user.uid,createdAt:serverTimestamp()})}catch(e){alert(errMsg(e))}inp.value=""},
  rmImg(){addDoc(collection(db,"posts",L.id,"comments"),{kind:"img",src:"",uid:S.user.uid,createdAt:serverTimestamp()}).catch(()=>{})},
  say(){const i=$("lmsg"),t=i.value.trim().slice(0,200);if(!t)return;i.value="";
    addDoc(collection(db,"posts",L.id,"comments"),{kind:"chat",uid:S.user.uid,name:S.me.name,text:t,createdAt:serverTimestamp()}).catch(e=>alert(errMsg(e)))},
  react(e){const n=Date.now();if(n-(L.lr||0)<800)return;L.lr=n;
    addDoc(collection(db,"posts",L.id,"comments"),{kind:"react",uid:S.user.uid,e,c:n,createdAt:serverTimestamp()}).catch(()=>{})},
  sound(){L.audio?.play().then(()=>toast("Son activé"),()=>toast("Clique sur la page puis réessaie"))},
  async toggleCam(){if(!L?.host)return;if(L.camTrack)return A.stopTrack("cam");
    let st;try{st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:854},height:{ideal:480},frameRate:{ideal:24}},audio:false})}
    catch(e){return alert("Caméra refusée ou introuvable : autorise-la dans le navigateur.")}
    A.setTrack("cam",st)},
  async toggleScr(){if(!L?.host)return;if(L.scrTrack)return A.stopTrack("scr");
    if(!navigator.mediaDevices.getDisplayMedia)return alert("Le partage d'écran n'est pas disponible sur cet appareil.");
    let st;try{st=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false})}catch(e){return alert("Partage d'écran refusé ou annulé.")}
    A.setTrack("scr",st)},
  setTrack(k,st){const t=st.getVideoTracks()[0];t.contentHint=k==="scr"?"detail":"motion";t.onended=()=>A.stopTrack(k);
    L[k+"Track"]=t;L[k+"Stream"]=st;Object.values(L.pcs).forEach(addTracks);
    updateDoc(lref(L.id),{[k+"Sid"]:st.id}).catch(()=>{});drawVideo();toast(k==="scr"?"Écran partagé":"Caméra activée")},
  stopTrack(k){const t=L?.[k+"Track"];if(!t||!L.host)return;
    Object.values(L.pcs).forEach(pc=>{const sd=pc._snd?.[t.id];if(sd){try{pc.removeTrack(sd)}catch(e){}delete pc._snd[t.id]}});
    t.stop();L[k+"Track"]=null;L[k+"Stream"]=null;updateDoc(lref(L.id),{[k+"Sid"]:null}).catch(()=>{});drawVideo();toast(k==="scr"?"Partage d'écran arrêté":"Caméra coupée")},
  layout(v){if(L?.host)updateDoc(lref(L.id),{layout:v}).catch(()=>{})}
};
addEventListener("resize",fitSwipe);
addEventListener("keydown",e=>{if(S.view?.t!=="swipe"||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||""))return;
  if(e.key==="ArrowDown"||e.key==="PageDown"){e.preventDefault();A.snap(1)}else if(e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();A.snap(-1)}});
addEventListener("pagehide",()=>{if(L?.host)updateDoc(lref(L.id),{liveOn:false}).catch(()=>{})});
</script>
