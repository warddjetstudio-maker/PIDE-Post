<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIDE Post · Admin monétisation</title>
<style>
:root{--bg:#0f0f17;--sf:#181826;--sf2:#252540;--tx:#f2f2fa;--mu:#9a9ab8;--c1:#00e5ff;--c2:#ff2bd6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;color:transparent}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}
.sp{flex:1}
.btn{background:var(--sf2);border:0;border-radius:20px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.on{background:var(--c1);color:#000}
.pri{background:linear-gradient(90deg,var(--c1),var(--c2));color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer}
.ok{background:#1fbf6a;color:#000;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer}
.no{background:#ff3b5c;color:#fff;border:0;border-radius:20px;padding:9px 18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--sf);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sub{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.st div{background:var(--sf2);border-radius:10px;padding:8px 12px}
.st b{display:block;font-size:16px}
.good{color:#39ff88}.bad{color:#ff5470}
.mail{background:var(--bg);border-radius:8px;padding:6px 10px;display:inline-block;margin-top:6px;user-select:all}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--sf2);border-radius:10px;padding:10px;margin:5px 0}
.modal{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.box{background:var(--sf);border-radius:18px;max-width:520px;width:100%;max-height:94vh;overflow:auto;padding:20px}
.err{color:#ff5470;font-size:13px;min-height:18px}
.empty{text-align:center;color:var(--mu);padding:50px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:22px;z-index:50;font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,addDoc,updateDoc,query,where,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* Seuls ces comptes Google peuvent ouvrir cette page (à doubler dans les règles Firestore). */
const ADMINS=["ward.djet.studio@gmail.com"];

const app=initializeApp({apiKey:"AIzaSyDtCmvlrwEblK8a5e0L9vwuLZ2XCIstiDo",authDomain:"pide-post.firebaseapp.com",projectId:"pide-post",storageBucket:"pide-post.firebasestorage.app",messagingSenderId:"664464722132",appId:"1:664464722132:web:6a1479bf8d1aea7e8b9341"});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=c=>((c||0)/100).toFixed(2).replace(".",",")+" €";
const ms=r=>r.createdAt?.toMillis?.()||Date.now();
const when=r=>new Date(ms(r)).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const errMsg=e=>(e?.code==="permission-denied"?"Firestore refuse l'accès : ajoute les règles admin (voir les explications).":(e?.message||"Erreur"));

const S={user:null,tab:"pending",list:[],err:""};

onAuthStateChanged(auth,u=>{S.user=u;S.err="";if(isAdmin())load();else draw()});
const isAdmin=()=>!!S.user&&ADMINS.includes((S.user.email||"").toLowerCase());

async function stats(uid){
  const [u,ps,er]=await Promise.all([getDoc(doc(db,"users",uid)),getDocs(query(collection(db,"posts"),where("authorId","==",uid))),getDocs(query(collection(db,"earnings"),where("to","==",uid),limit(5000)))]);
  const d=u.data()||{};
  return {fol:d.followers||0,views:ps.docs.reduce((a,x)=>a+(x.data().views||0),0)+(d.liveViews||0),earned:er.size*1,monet:!!d.monet}}

async function load(){
  S.list=null;draw();
  try{
    const q=S.tab==="pending"?query(collection(db,"payouts"),where("status","==","pending")):query(collection(db,"payouts"),where("status","in",["paid","refused"]));
    const sn=await getDocs(q);
    const list=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ms(b)-ms(a));
    await Promise.all(list.map(async r=>{try{r.stats=await stats(r.uid)}catch(e){r.stats=null}}));
    S.list=list;S.err=""}
  catch(e){S.list=[];S.err=errMsg(e)}
  draw()}

function draw(){
  const a=$("app");
  if(!S.user)return a.innerHTML=`<div style="text-align:center;margin-top:12vh"><div class="logo" style="font-size:34px">PIDE Post · Admin</div><p class="sub">Demandes de versement de la monétisation</p><button class="pri" onclick="X.login()">Connexion avec Google</button><div class="err">${esc(S.err)}</div></div>`;
  if(!isAdmin())return a.innerHTML=`<div style="text-align:center;margin-top:12vh"><div class="logo" style="font-size:28px">Accès refusé</div><p class="sub">${esc(S.user.email||"")} n'est pas administrateur.</p><button class="btn" onclick="X.out()">Se déconnecter</button></div>`;
  const items=S.list===null?`<div class="empty">Chargement…</div>`:S.list.length?S.list.map(card).join(""):`<div class="empty">${S.tab==="pending"?"Aucune demande en attente 🎉":"Rien dans l'historique."}</div>`;
  a.innerHTML=`<div class="bar"><span class="logo">PIDE Post · Admin</span><span class="sp"></span><button class="btn" onclick="X.load()">↻ Actualiser</button><button class="btn" onclick="X.out()">Déconnexion</button></div>
  <div class="bar" style="margin-top:0"><button class="btn ${S.tab==="pending"?"on":""}" onclick="X.tab('pending')">⏳ En attente</button><button class="btn ${S.tab==="done"?"on":""}" onclick="X.tab('done')">📜 Historique</button></div>
  <div class="err">${esc(S.err)}</div>${items}`}

function card(r){
  const s=r.stats,tag={pending:"⏳ En attente",paid:"✅ Payé",refused:"❌ Refusé"}[r.status]||r.status;
  return `<div class="card"><h3><span>${esc(r.name||"Anonyme")} · ${eur(r.cents)}</span><span class="sub">${tag} · ${when(r)}</span></h3>
  <div class="sub">PayPal : <span class="mail">${esc(r.email||"(aucun email)")}</span> <button class="btn" style="padding:3px 10px" onclick="X.copy('${esc(r.id)}')">Copier</button></div>
  ${s?`<div class="st"><div>Abonnés<b class="${s.fol>=5?"good":"bad"}">${s.fol} / 5</b></div><div>Vues<b class="${s.views>=100?"good":"bad"}">${s.views} / 100</b></div><div>Gains générés<b>${eur(s.earned)}</b></div><div>Monétisation<b>${s.monet?"activée":"désactivée"}</b></div></div>`:`<div class="sub" style="margin:8px 0">Statistiques indisponibles.</div>`}
  ${r.msg?`<div class="sub">Message : ${esc(r.msg)}</div>`:""}
  ${r.status==="pending"?`<div class="row"><button class="ok" onclick="X.pay('${esc(r.id)}')">✅ J'ai payé</button><button class="no" onclick="X.refuse('${esc(r.id)}')">❌ Refuser</button></div>`:""}</div>`}

const find=id=>(S.list||[]).find(r=>r.id===id);
const notif=(to,text)=>addDoc(collection(db,"notifs"),{to,from:S.user.uid,type:"payout",pid:"",text,read:false,createdAt:serverTimestamp()});

const REASONS={
  nv:"Ta monétisation n'est pas validée : tu ne remplis pas (ou plus) les conditions. Reviens quand tu auras 5 abonnés et 100 vues.",
  ga:"Tu n'as pas encore généré assez d'argent pour que je te verse tes gains. Continue, ta demande sera étudiée plus tard."};

window.X={
  login(){S.err="";signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{S.err=errMsg(e);draw()})},
  out(){signOut(auth)},
  load,
  tab(t){S.tab=t;load()},
  copy(id){const r=find(id);navigator.clipboard?.writeText(r?.email||"").then(()=>toast("Email copié"),()=>prompt("Copie l'email :",r?.email||""))},
  async pay(id){const r=find(id);if(!r)return;
    if(!confirm("Confirme : tu as bien envoyé "+eur(r.cents)+" à "+r.email+" via PayPal ?"))return;
    try{const msg="Ton paiement de "+eur(r.cents)+" a été envoyé sur ton PayPal 🎉";
      await updateDoc(doc(db,"payouts",id),{status:"paid",msg,paidAt:serverTimestamp()});
      await notif(r.uid,msg).catch(()=>{});toast("Marqué comme payé");load()}catch(e){alert(errMsg(e))}},
  refuse(id){const r=find(id);if(!r)return;
    $("modal").innerHTML=`<div class="modal"><div class="box"><h3 style="margin-top:0">Refuser la demande de ${esc(r.name||"")} (${eur(r.cents)})</h3>
    <div class="sub">Raison</div>
    <select id="rs" onchange="X.reason()"><option value="nv">Monétisation non validée</option><option value="ga">Pas assez d'argent généré</option><option value="au">Autre (j'écris mon message)</option></select>
    <div class="sub" style="margin-top:8px">Message envoyé à la personne</div>
    <textarea id="rm" rows="4" maxlength="300">${esc(REASONS.nv)}</textarea>
    <label id="rd" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rk" style="width:auto;margin:0" checked>Désactiver aussi sa monétisation</label>
    <div class="err" id="re"></div>
    <div class="row"><button class="no" onclick="X.refuseGo('${esc(id)}')">Envoyer le refus</button><button class="btn" onclick="X.close()">Annuler</button></div></div></div>`},
  reason(){const v=$("rs").value;if(REASONS[v])$("rm").value=REASONS[v];else $("rm").value="";$("rd").style.display=v==="nv"?"flex":"none"},
  close(){$("modal").innerHTML=""},
  async refuseGo(id){const r=find(id);if(!r)return;const v=$("rs").value,msg=$("rm").value.trim();
    if(!msg)return $("re").textContent="Écris un message pour la personne.";
    try{await updateDoc(doc(db,"payouts",id),{status:"refused",reason:v,msg,refusedAt:serverTimestamp()});
      await notif(r.uid,msg).catch(()=>{});
      if(v==="nv"&&$("rk").checked)await updateDoc(doc(db,"users",r.uid),{monet:false}).catch(()=>{});
      X.close();toast("Refus envoyé");load()}catch(e){$("re").textContent=errMsg(e)}}
};
</script>
</body>
</html>
